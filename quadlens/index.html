/* Creations Toolkit engine.css v1.4.0 (shared by every tool; do not edit per tool) */
:root {
  --navy: #0E1B3D;
  --navy-soft: #1C2B55;
  --navy-line: #3A4A78;
  --gold: #F2C14E;
  --gold-deep: #B8861B;
  --gold-text: #8A6410;
  --ivory: #FBF8F1;
  --paper: #FFFFFF;
  --ink: #18213A;
  --muted: #5A6278;
  --line: #E4DED0;
  --line-soft: #F0EBDF;
  --on-navy: #DDE1EA;
  --on-navy-muted: #C9CEDB;
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "Libre Franklin", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ivory); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: var(--navy); }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(28px, 4vw, 38px); color: var(--navy); }
p { margin: 0; }
.prose { max-width: 66ch; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.noscript { padding: 16px 20px; background: var(--gold); color: var(--navy); font-weight: 600; }

/* hero */
.hero { background: var(--navy); color: var(--ivory); padding: 28px 0 56px; }
.brandline { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.brandline span { color: var(--on-navy-muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
.hero h1 { font-size: clamp(36px, 6vw, 60px); margin-top: 36px; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero .lead { margin-top: 20px; max-width: 60ch; font-size: 19px; color: var(--on-navy); }
.letters { display: flex; gap: 10px; margin-top: 32px; flex-wrap: wrap; padding: 0; list-style: none; }
.letters li { border: 1px solid var(--navy-line); border-radius: 10px; padding: 10px 16px; min-width: 120px; }
.letters b { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--gold); display: block; line-height: 1; }
.letters small { font-size: 14px; color: var(--on-navy); }
.btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
.btn { display: inline-block; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 16px; line-height: 1.3; text-decoration: none; border: 2px solid var(--gold); cursor: pointer; font-family: var(--body); text-align: center; }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-line { background: transparent; color: var(--gold); }
.btn-navy { background: var(--navy); color: var(--ivory); border-color: var(--navy); }
.btn-plain { background: transparent; color: var(--navy); border-color: var(--navy); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

section { padding: 64px 0; border-bottom: 1px solid var(--line); }
.sec-intro { margin-top: 12px; color: var(--muted); max-width: 66ch; }

/* overview */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 32px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.card.key { border: 2px solid var(--gold-deep); }
.card .num { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.block { margin-top: 24px; background: var(--paper); border: 1px dashed var(--gold-deep); border-radius: 12px; padding: 20px 24px; }

.block th, .block td { text-align: start; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }

.flow { display: flex; align-items: center; gap: 6px; margin: 16px 0; flex-wrap: wrap; }
.flow span { font-family: var(--display); font-size: 26px; min-width: 48px; height: 48px; padding: 0 8px; display: grid; place-items: center; border-radius: 10px; background: var(--navy); color: var(--gold); }
.flow i { color: var(--muted); font-style: normal; }

/* checklist */
.tool { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; margin-top: 32px; align-items: start; }
.groups { display: flex; flex-direction: column; gap: 16px; }
fieldset { margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 18px 20px 12px; min-width: 0; }
legend { font-family: var(--display); font-size: 22px; color: var(--navy); padding: 0 6px; }
fieldset .fq { font-size: 14px; color: var(--muted); margin: -2px 0 4px; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; min-height: 44px; border-top: 1px solid var(--line-soft); }
.item:first-of-type { border-top: 0; }
.item input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--navy); flex: none; cursor: pointer; }
.item label { cursor: pointer; font-size: 16px; flex: 1; }
.item input:checked + label { color: var(--muted); }
.panel { position: sticky; top: 16px; background: var(--navy); color: var(--ivory); border-radius: 12px; padding: 22px; }
.panel h3 { font-size: 22px; color: var(--gold); }
.total { font-variant-numeric: tabular-nums; font-size: 15px; margin-top: 6px; color: var(--on-navy-muted); }
.bars { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.bar-row { display: grid; grid-template-columns: 34px 1fr 44px; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar-row b { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--gold); }
.track { height: 10px; background: var(--navy-soft); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .25s; }
.panel-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.panel-btns .btn { font-size: 15px; padding: 10px 14px; }
.panel-btns .btn-gold { flex: 1 1 100%; }
.note { font-size: 13px; color: var(--on-navy-muted); margin-top: 12px; }
.mbar { display: none; }
/* 1.3.0: views switch (only rendered when extensions.views is set) */
.views { margin-top: 24px; border: 0; background: transparent; padding: 0; }
.views legend { font-family: var(--body); font-size: 16px; font-weight: 600; color: var(--navy); padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label { cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; padding: 10px 18px; border: 2px solid var(--navy); border-radius: 999px; font-weight: 600; font-size: 16px; color: var(--navy); background: var(--paper); }
.seg input:checked + label { background: var(--navy); color: var(--gold); }
.seg input:focus-visible + label { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
.views .vnote { margin-top: 8px; font-size: 15px; color: var(--muted); max-width: 66ch; }

/* results */
#results[hidden] { display: none; }
.results-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.stale { margin-top: 20px; background: var(--paper); border-inline-start: 4px solid var(--gold-deep); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stale[hidden] { display: none; }
.band { margin-top: 24px; background: var(--navy); color: var(--ivory); border-radius: 12px; padding: 24px; display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-items: center; }
.band .pct { font-family: var(--display); font-size: clamp(48px, 9vw, 72px); color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }
.band .bname { font-family: var(--display); font-size: 26px; color: var(--gold); line-height: 1.2; }
.band .bdesc { color: var(--on-navy); margin-top: 4px; }
.band .bmeta { grid-column: 1 / -1; font-size: 14px; color: var(--on-navy-muted); }
.band .cap { grid-column: 1 / -1; font-size: 14px; color: var(--ivory); border-top: 1px solid var(--navy-line); padding-top: 10px; }
.quad { margin-top: 16px; background: var(--paper); border: 2px solid var(--gold-deep); border-radius: 12px; padding: 20px 24px; display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; }
.quad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.quad-grid span { aspect-ratio: 1; border-radius: 6px; background: var(--line-soft); }
.quad-grid span.on { background: var(--gold); }
.quad h3 { font-size: 24px; color: var(--navy); }
.quad .qkicker { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--gold-text); }
.r-h { font-size: 26px; color: var(--navy); margin-top: 40px; }
.secrows { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.secrow { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 6px 16px; align-items: center; }
.secrow .sname { font-weight: 700; color: var(--navy); }
.secrow .sread { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
.secrow .smeter { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.secrow .track { background: var(--line-soft); }
.secrow .fill { background: var(--gold-deep); }
.prios { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; padding: 0; list-style: none; }
.prio { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 14px; }
.prio .pn { grid-row: span 4; width: 36px; height: 36px; border-radius: 999px; background: var(--gold); color: var(--navy); font-family: var(--display); font-size: 20px; display: grid; place-items: center; }
.prio .psec { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--gold-text); }
.prio .pcrit { font-weight: 700; color: var(--navy); }
.prio .plabel { font-weight: 700; color: var(--ink); }
.prio .pfix, .prio .pwhy { margin-top: 6px; }
.prio .pwhy { color: var(--muted); font-size: 15px; }
.prio .pmissing { margin-top: 6px; color: var(--muted); font-style: italic; }
.done { margin-top: 16px; background: var(--paper); border-inline-start: 4px solid var(--gold-deep); padding: 16px 20px; }
.done h3 { font-size: 22px; color: var(--navy); }
.done p { margin-top: 6px; }
.enquiry { margin-top: 24px; background: var(--navy); color: var(--ivory); border-radius: 12px; padding: 22px 24px; }
.enquiry p { color: var(--on-navy); }
.enquiry .btns { margin-top: 16px; }
.fixlist { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }

.results-btns { margin-top: 24px; }
.print-only { display: none; }

.family { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 28px; }
.family a { display: block; text-decoration: none; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px; color: var(--ink); }
.family a b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--navy); }
.family a small { color: var(--muted); font-size: 14px; display: block; }
.family a.here { border: 2px solid var(--gold-deep); }
.family a .aud { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--gold-text); text-transform: uppercase; letter-spacing: .04em; }
.related-body { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.limit { margin-top: 20px; background: var(--paper); border-inline-start: 4px solid var(--gold-deep); padding: 14px 18px; font-size: 15px; max-width: 66ch; }
.sources-note { margin-top: 10px; font-size: 15px; color: var(--muted); max-width: 66ch; }
.refs { margin-top: 24px; font-size: 15px; color: var(--muted); }
.refs p { padding-inline-start: 2em; text-indent: -2em; margin-top: 8px; overflow-wrap: anywhere; }
.about { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: center; }
.about-bio { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.about img { width: 200px; height: auto; border-radius: 12px; border: 3px solid var(--gold); display: block; }
.contact { background: var(--navy); color: var(--ivory); border-bottom: 0; }
.contact h2 { color: var(--gold); }
.contact p { color: var(--on-navy); }
.contact .addr { margin-top: 14px; font-size: 15px; color: var(--on-navy-muted); }
footer { background: var(--navy); color: var(--on-navy-muted); font-size: 14px; padding: 24px 0 40px; border-top: 1px solid var(--navy-line); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer nav { display: flex; flex-wrap: wrap; gap: 6px 14px; }
footer a { color: var(--gold); }

@media (max-width: 820px) {
  .tool { grid-template-columns: 1fr; }
  .panel { position: static; }
  body.has-mbar { padding-bottom: 76px; }
  .mbar { display: flex; position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: var(--navy); color: var(--ivory); padding: 10px 16px; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 -4px 16px rgba(14, 27, 61, .25); }
  .mbar .mcount { font-size: 15px; font-variant-numeric: tabular-nums; }
  .mbar .btn { padding: 10px 16px; font-size: 15px; }
  .mbar[hidden] { display: none; }
}
@media (max-width: 560px) {
  section { padding: 48px 0; }
  .about { grid-template-columns: 1fr; }
  .about img { width: 160px; }
  .band { grid-template-columns: 1fr; }
  .quad { grid-template-columns: 1fr; }
  .quad-grid { width: 96px; }
  .secrow { grid-template-columns: 1fr; }
  .prio { grid-template-columns: 1fr; }
  .prio .pn { grid-row: auto; }
  .letters li { min-width: 0; flex: 1 1 40%; }
  .btns .btn { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } html { scroll-behavior: auto; } }
@media print {
  body { background: #fff; font-size: 11.5pt; padding: 0 !important; }
  #app > *:not(main), main > section:not(#results), .mbar, .results-btns, #download-note, .enquiry, .stale { display: none !important; }
  #results { display: block !important; padding: 0; border: 0; }
  .print-only { display: block; }
  .print-head { border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 8px; }
  .print-head h1 { font-size: 22pt; color: var(--navy); }
  .print-head p { color: var(--muted); font-size: 10pt; }
  .band { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .secrow, .prio, .fixgroup li, .band, .quad { break-inside: avoid; }
  .fill, .track, .pn, .quad-grid span { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .r-h { margin-top: 20px; }
  .ticked { margin-top: 16px; font-size: 10pt; }
  .ticked ul { margin: 4px 0 0; padding-inline-start: 18px; }
}

   "criteria": [

     "text": {
      "en": "Key questions are thought-provoking, planned in advance, and ask students to explain how or why."

     "text": {

     "fix": {
      "en": "Use mini whiteboards or cold call for the key questions instead of hands up. Every student writes or thinks an answer before anyone speaks."

 "nextLevel": {
  "en": "All twenty-one look-fors are in place. Next challenge: build the success criteria with your students. Show them two pieces of work, one strong and one weaker, and ask what makes the difference. Their words become the criteria for the next task."

 "related": {
  "title": {
   "en": "Related work"
  },
  "paragraphs": [
   {
    "en": "QuadLens is my framework for looking at a lesson from the students' side. Each lens draws on established research. Clarity of learning follows work on learning goals and success criteria (Sadler, 1989; Hattie & Timperley, 2007). Support and challenge and cognitive engagement draw on the principles of instruction summarized by Rosenshine (2012). Assessment for learning rests on Black and Wiliam's (1998) review of formative assessment."
   },
   {
    "en": "What QuadLens adds is the four lenses as one view of a lesson, twenty-one look-fors that work for planning, observing and reflecting, and a priority order that tells a teacher which gap to close first."
   }
  ]
 },

  "bio": {
   "en": "Dr. A.Sattar Amri is the General Director of Al Rawabi Schools, Bahrain. He has worked in education for more than 30 years, as a teacher, head of department, school improvement partner and principal. He is a Professional Certified Trainer (PCT) with Canada Global Center and an Edexcel Certified Quality Consultant.\n\nHe created QuadLens, QuadFlow, KUD Lesson Design, LeadCTRM and QuadOwn. QuadFlow comes from his book Task Switching Dynamics. He also hosts Teacher's Lighthouse on YouTube."

<script>
/* Creations Toolkit engine.js v1.4.0
   Shared by every tool. Contains no user-facing text: every string comes from the JSON block #tool-data.
   Answers stay in memory only; nothing is stored or sent. */
(function (root) {
  'use strict';

  /* ---------- pure helpers (also used by the test harness) ---------- */
  function txt(field, lang) {
    if (field == null) return '';
    if (typeof field === 'string') return field;
    return field[lang] != null ? field[lang] : (field.en != null ? field.en : '');
  }
  function fill(str, vars) {
    return String(str).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pctOf(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function readingKey(met, n) {
    if (met === 0) return 'none';
    if (met === n) return 'full';
    return pctOf(met, n) < 50 ? 'low' : 'mid';
  }

  /* score(): the whole feedback model as one pure function.
     data: the tool data; ticked: object of criterion id -> true. */
  function score(data, ticked) {
    var sections = data.sections;
    var all = [], total = 0, met = 0;
    var secStats = sections.map(function (s, si) {
      var m = 0;
      s.criteria.forEach(function (c, ci) {
        var on = !!ticked[c.id];
        if (on) m++;
        all.push({ id: c.id, section: s.id, si: si, ci: ci, weight: c.weight || 1, on: on, tags: c.tags || [] });
      });
      total += s.criteria.length; met += m;
      var n = s.criteria.length;
      return { id: s.id, met: m, n: n, pct: pctOf(m, n), reading: readingKey(m, n) };
    });
    var pct = pctOf(met, total);

    // band: highest band whose min <= pct, then the weak-section cap
    var bands = data.bands.slice().map(function (b, i) { return { min: b.min, i: i }; }).sort(function (a, b) { return a.min - b.min; });
    var band = 0;
    bands.forEach(function (b) { if (pct >= b.min) band = b.i; });
    var capped = null;
    var cap = data.bandCap;
    if (cap && cap.maxBand) {
      var weak = secStats.filter(function (s) { return s.pct < cap.sectionBelow; });
      if (weak.length && band > cap.maxBand - 1) {
        band = cap.maxBand - 1;
        weak.sort(function (a, b) { return a.pct - b.pct; });
        capped = weak[0].id;
      }
    }

    // priorities: weight desc, weakest section first, section order, criterion order
    var secPct = {};
    secStats.forEach(function (s) { secPct[s.id] = s.pct; });
    var open = all.filter(function (c) { return !c.on; });
    open.sort(function (a, b) {
      return (b.weight - a.weight) || (secPct[a.section] - secPct[b.section]) || (a.si - b.si) || (a.ci - b.ci);
    });
    var mode = met === 0 ? 'first' : (open.length === 0 ? 'all' : 'normal');
    var count = (data.priorities && data.priorities.count) || 3;
    var priorities = mode === 'first' ? open.slice(0, 1) : open.slice(0, count);

    var result = {
      total: total, met: met, pct: pct, band: band, capped: capped, mode: mode,
      sections: secStats,
      priorities: priorities.map(function (c) { return c.id; }),
      open: open.map(function (c) { return c.id; })
    };

    // extension: layers (a tag counted across sections)
    var ext = data.extensions || {};
    if (ext.layers) {
      result.layers = ext.layers.map(function (L) {
        var tagged = all.filter(function (c) { return c.tags.indexOf(L.tag) > -1; });
        var m = tagged.filter(function (c) { return c.on; }).length;
        return { id: L.id, met: m, n: tagged.length, pct: pctOf(m, tagged.length), reading: readingKey(m, tagged.length) };
      });
      // 1.1.0: optional layer cap. A layer with capBelow holds the band at bandCap.maxBand - 1, like a weak section.
      if (cap && cap.maxBand) {
        ext.layers.forEach(function (L, i) {
          var Ls = result.layers[i];
          if (L.capBelow != null && Ls.n && Ls.pct < L.capBelow && result.band > cap.maxBand - 1) {
            result.band = cap.maxBand - 1;
            if (!result.capped) { result.capped = L.id; result.cappedLayer = true; }
          }
        });
      }
    }
    // extension: quadrant (two tagged axes, each high when pct >= threshold)
    if (ext.quadrant) {
      var q = ext.quadrant;
      var axis = function (A) {
        var tagged = all.filter(function (c) { return c.tags.indexOf(A.tag) > -1; });
        var m = tagged.filter(function (c) { return c.on; }).length;
        var p = pctOf(m, tagged.length);
        return { met: m, n: tagged.length, pct: p, high: p >= A.threshold };
      };
      var x = axis(q.x), y = axis(q.y);
      result.quadrant = { x: x, y: y, cell: (x.high ? 'h' : 'l') + (y.high ? 'h' : 'l') };
    }
    return result;
  }

  /* ---------- page rendering ---------- */
  function App(data) {
    var lang = (data.meta && data.meta.lang) || 'en';
    var T = function (f) { return txt(f, lang); };
    var L = function (key, vars) { return fill(T(data.labels[key]), vars); };
    var E = function (f) { return esc(T(f)); };
    var full = data.meta.edition === 'full';
    var taste = data.meta.edition === 'taste';  // 1.4.0: the YouTube taste: fixes on the first priority only
    var ticked = {};
    var shown = false;
    var byId = {}, secById = {};
    data.sections.forEach(function (s) { secById[s.id] = s; s.criteria.forEach(function (c) { byId[c.id] = { c: c, s: s }; }); });
    var refById = {};
    (data.references || []).forEach(function (r) { refById[r.id] = r; });
    var $ = function (id) { return document.getElementById(id); };

    // 1.3.0: optional views (extensions.views). Off when absent: pick() then returns the base field.
    var VX = (data.extensions || {}).views || null;
    var view = VX ? (VX['default'] || VX.options[0].id) : null;
    function pick(obj, key) {
      if (view && obj && obj.views && obj.views[view] && obj.views[view][key] != null) return obj.views[view][key];
      return obj ? obj[key] : undefined;
    }
    function viewOpt() { return VX ? VX.options.filter(function (o) { return o.id === view; })[0] : null; }
    function vtext(key, fallback) { var o = viewOpt(); return (o && o.text && o.text[key] != null) ? o.text[key] : fallback; }
    function pdfHref() { var o = viewOpt(); return (o && o.pdf) || data.hero.pdf; }

    function headline(f) {
      return esc(T(f)).replace(/\{([^}]+)\}/g, '<em>$1</em>');
    }
    function cites(why) {
      if (!why || !why.cite || !why.cite.length) return '';
      return ' (' + why.cite.map(function (id) { return esc(refById[id] ? refById[id].short : id); }).join('; ') + ')';
    }
    function link(href, cls, label, extra) {
      return '<a class="btn ' + cls + '" href="' + esc(href) + '"' + (extra || '') + '>' + label + '</a>';
    }
    function contactButtons(text) {
      var c = data.contact;
      var wa = 'https://wa.me/' + c.whatsapp + (text ? '?text=' + encodeURIComponent(text) : '');
      var mail = 'mailto:' + c.email + (text ? '?subject=' + encodeURIComponent(text) : '');
      return '<div class="btns">' + link(wa, 'btn-gold', L('whatsapp')) + link(mail, 'btn-line', L('emailBtn', { email: c.email })) + '</div>';
    }

    function renderHero() {
      var h = data.hero;
      var letters = data.sections.map(function (s) {
        return '<li><b>' + esc(s.letter) + '</b><small>' + E(s.name) + '</small></li>';
      }).join('');
      return '<header class="hero"><div class="wrap">' +
        '<div class="brandline">' + E(h.brandline) + ' <span>' + E(h.byline) + '</span></div>' +
        '<h1>' + headline(h.headline) + '</h1>' +
        '<p class="lead">' + E(h.lead) + '</p>' +
        '<ul class="letters" aria-label="' + E(h.lettersLabel) + '">' + letters + '</ul>' +
        '<div class="btns">' + link(pdfHref(), 'btn-gold', L('pdfBtn'), ' id="hero-pdf"') + link('#checklist', 'btn-line', L('useOnline')) + link(data.links.youtube, 'btn-line', L('youtube')) + '</div>' +
        '</div></header>';
    }

    function renderOverview() {
      return (data.overview || []).map(function (b, bi) {
        var inner = '';
        if (b.type === 'cards') {
          inner = '<div class="cards">' + data.sections.map(function (s, i) {
            var o = s.overview || {};
            return '<article class="card' + (o.key ? ' key' : '') + '">' +
              (o.tag ? '<span class="tag">' + E(o.tag) + '</span>' : '') +
              '<div class="num">' + E(o.kicker) + '</div>' +
              '<h3><b>' + esc(s.letter) + '</b> ' + E(s.name) + '</h3>' +
              '<p class="q">' + E(s.question) + '</p>' +
              (o.points ? '<ul>' + o.points.map(function (p) { return '<li>' + E(p) + '</li>'; }).join('') + '</ul>' : '') +
              '</article>';
          }).join('') + '</div>';
        } else if (b.type === 'table') {
          inner = '<div class="block">' + (b.blockTitle ? '<h3>' + E(b.blockTitle) + '</h3>' : '') + '<table>' +
            b.rows.map(function (r) { return '<tr><th scope="row">' + E(r.label) + '</th><td>' + E(r.text) + '</td></tr>'; }).join('') + '</table></div>';
        } else if (b.type === 'flow') {
          inner = '<div class="block">' + (b.blockTitle ? '<h3>' + E(b.blockTitle) + '</h3>' : '') +
            '<div class="flow" aria-label="' + E(b.ariaLabel) + '">' + b.steps.map(function (s) { return '<span>' + esc(s) + '</span>'; }).join('<i aria-hidden="true">→</i>') + '</div>' +
            (b.body ? '<p>' + E(b.body) + '</p>' : '') + '</div>';
        } else if (b.type === 'note') {
          inner = '<div class="block">' + (b.blockTitle ? '<h3>' + E(b.blockTitle) + '</h3>' : '') + '<p>' + E(b.body) + '</p></div>';
        }
        return '<section id="overview-' + bi + '"><div class="wrap">' +
          (b.title ? '<h2>' + E(b.title) + '</h2>' : '') + (b.intro ? '<p class="sec-intro">' + E(b.intro) + '</p>' : '') +
          inner + '</div></section>';
      }).join('');
    }

    function renderChecklist() {
      var c = data.checklist;
      var groups = data.sections.map(function (s) {
        return '<fieldset data-section="' + esc(s.id) + '" aria-describedby="fq-' + esc(s.id) + '"><legend>' + esc(s.letter) + ' · ' + E(s.name) + '</legend><p class="fq" id="fq-' + esc(s.id) + '">' + E(pick(s, 'question')) + '</p>' +
          s.criteria.map(function (cr) {
            return '<div class="item"><input type="checkbox" id="cb-' + esc(cr.id) + '" data-id="' + esc(cr.id) + '">' +
              '<label for="cb-' + esc(cr.id) + '" id="lb-' + esc(cr.id) + '">' + critLabel(cr) + '</label></div>';
          }).join('') + '</fieldset>';
      }).join('');
      var switcher = VX ? '<fieldset class="views" id="views"><legend>' + E(VX.label) + '</legend><div class="seg">' +
        VX.options.map(function (o) {
          return '<input type="radio" name="tool-view" id="view-' + esc(o.id) + '" value="' + esc(o.id) + '"' + (o.id === view ? ' checked' : '') + '>' +
            '<label for="view-' + esc(o.id) + '">' + E(o.label) + '</label>';
        }).join('') + '</div>' + (VX.note ? '<p class="vnote">' + E(VX.note) + '</p>' : '') + '</fieldset>' : '';
      var bars = data.sections.map(function (s) {
        return '<div class="bar-row"><b aria-hidden="true">' + esc(s.letter) + '</b><div class="track" aria-hidden="true"><div class="fill" id="bar-' + esc(s.id) + '"></div></div>' +
          '<span id="n-' + esc(s.id) + '">0/' + s.criteria.length + '</span><span class="sr-only">' + E(s.name) + '</span></div>';
      }).join('');
      return '<section id="checklist"><div class="wrap">' +
        '<h2>' + E(c.title) + '</h2><p class="sec-intro">' + E(c.intro) + ' <a href="' + esc(pdfHref()) + '" id="cl-pdf">' + E(c.pdfLink) + '</a></p>' + switcher +
        '<div class="tool"><form class="groups" id="tool-form" novalidate>' + groups + '</form>' +
        '<aside class="panel" id="panel" aria-label="' + E(vtext('panelTitle', c.panelTitle)) + '"><h3 id="panel-h">' + E(vtext('panelTitle', c.panelTitle)) + '</h3>' +
        '<div class="total" id="total" aria-live="polite"></div><div class="bars">' + bars + '</div>' +
        '<div class="panel-btns"><button type="button" class="btn btn-gold" id="show-btn">' + L('showResults') + '</button>' +
        '<button type="button" class="btn btn-line" id="reset-btn">' + L('reset') + '</button></div>' +
        '<p class="note">' + L('privacy') + '</p></aside></div></div></section>' +
        '<div class="mbar" id="mbar"><span class="mcount" id="mcount"></span><button type="button" class="btn btn-gold" id="mshow-btn">' + L('showResults') + '</button></div>';
    }

    function critLabel(cr) {
      return (cr.code ? '<span class="code">' + esc(cr.code) + '</span>' : '') + E(pick(cr, 'text'));
    }
    function renderResultsShell() {
      return '<section id="results" hidden><div class="wrap">' +
        '<div class="print-only print-head"><h1>' + L('printTitle', { tool: T(data.meta.name) }) + '</h1><p id="print-view"></p><p id="print-date"></p></div>' +
        '<div class="results-head"><h2 id="results-h" tabindex="-1">' + L('resultsTitle') + '</h2></div>' +
        '<div class="stale" id="stale" hidden><span>' + L('stale') + '</span><button type="button" class="btn btn-plain" id="update-btn">' + L('updateResults') + '</button></div>' +
        '<div id="results-body"></div></div></section>';
    }

    function capLine(r) {
      if (!r.cappedLayer) return L('capNote', { section: T(secById[r.capped].name), limit: data.bandCap.sectionBelow });
      var Ld = data.extensions.layers.filter(function (x) { return x.id === r.capped; })[0];
      return L('capNote', { section: T(Ld.capName || Ld.name), limit: Ld.capBelow });
    }
    function renderResults() {
      var r = score(data, ticked);
      var b = data.bands[r.band];
      var h = '';
      var pv = $('print-view');
      if (pv) pv.textContent = VX ? T(viewOpt().label) : '';
      // 1. band
      h += '<div class="band"><div class="pct">' + r.pct + '%</div><div><div class="bname">' + E(pick(b, 'name')) + '</div><p class="bdesc">' + E(pick(b, 'desc')) + '</p></div>' +
        '<p class="bmeta">' + L('bandMeta', { met: r.met, total: r.total }) + '</p>' +
        (r.capped ? '<p class="cap">' + capLine(r) + '</p>' : '') + '</div>';
      // extension: quadrant
      if (r.quadrant) {
        var q = data.extensions.quadrant, cell = q.cells[r.quadrant.cell];
        var order = ['lh', 'hh', 'll', 'hl'];
        h += '<div class="quad"><div class="quad-grid" aria-hidden="true">' + order.map(function (k) { return '<span' + (k === r.quadrant.cell ? ' class="on"' : '') + '></span>'; }).join('') + '</div>' +
          '<div><div class="qkicker">' + E(q.kicker) + '</div><h3>' + E(pick(cell, 'name')) + '</h3><p>' + E(pick(cell, 'desc')) + '</p>' +
          '<p class="bmeta">' + L('quadMeta', { x: T(q.x.name), xm: r.quadrant.x.met, xn: r.quadrant.x.n, y: T(q.y.name), ym: r.quadrant.y.met, yn: r.quadrant.y.n }) + '</p></div></div>';
      }
      // 2. sections
      h += '<h3 class="r-h">' + L('bySection') + '</h3><div class="secrows">' + r.sections.map(function (s) {
        var sec = secById[s.id];
        return '<div class="secrow"><div class="sname">' + esc(sec.letter) + ' · ' + E(sec.name) + '</div>' +
          '<div class="smeter"><div class="track" aria-hidden="true"><div class="fill" style="width:' + s.pct + '%"></div></div><span>' + s.met + '/' + s.n + '</span></div>' +
          '<p class="sread">' + E(pick(sec, 'readings')[s.reading]) + '</p></div>';
      }).join('') + '</div>';
      // extension: layers
      if (r.layers) {
        h += '<div class="secrows">' + r.layers.map(function (Ls, i) {
          var Ld = data.extensions.layers[i];
          return '<div class="secrow"><div class="sname">' + E(Ld.name) + '</div>' +
            '<div class="smeter"><div class="track" aria-hidden="true"><div class="fill" style="width:' + Ls.pct + '%"></div></div><span>' + Ls.met + '/' + Ls.n + '</span></div>' +
            '<p class="sread">' + E(Ld.readings[Ls.reading]) + '</p></div>';
        }).join('') + '</div>';
      }
      // 3. priorities
      if (r.mode === 'all') {
        h += '<h3 class="r-h">' + L('allDoneTitle') + '</h3><div class="done"><p>' + E(vtext('nextLevel', data.nextLevel)) + '</p></div>';
      } else {
        h += '<h3 class="r-h">' + (r.mode === 'first' ? L('firstStepTitle') : L('prioritiesTitle', { n: r.priorities.length })) + '</h3>';
        if (r.mode === 'first') h += '<p class="sec-intro">' + L('firstStepIntro') + '</p>';
        h += '<ol class="prios">' + r.priorities.map(function (id, i) {
          var x = byId[id], c = x.c, fx = pick(c, 'fix'), wy = pick(c, 'why');
          if (taste && i >= ((data.priorities && data.priorities.tasteShowFixes) || 1)) fx = null;
          var body = taste && !fx ? '<p class="pmissing">' + L('tasteLocked') + '</p>' : fx ? '<p class="pfix"><span class="plabel">' + L('whatToDo') + '</span> ' + E(fx) + '</p>' +
            (wy && T(wy) ? '<p class="pwhy"><span class="plabel">' + L('why') + '</span> ' + E(wy) + cites(wy) + '</p>' : '')
            : '<p class="pmissing">' + L('fixInFull') + '</p>';
          return '<li class="prio"><span class="pn" aria-hidden="true">' + (i + 1) + '</span><div class="psec">' + E(x.s.name) + '</div>' +
            '<div class="pcrit">' + E(pick(c, 'text')) + '</div>' + body + '</li>';
        }).join('') + '</ol>';
      }
      // free: enquiry line; full: fix list + download
      if (taste) {
        h += '<div class="enquiry"><p>' + L('tasteLine', { tool: T(data.meta.name) }) + '</p>' + contactButtons(L('tasteEnquiryText', { tool: T(data.meta.name) })) + '</div>';
      } else if (!full) {
        h += '<div class="enquiry"><p>' + L('fullReportLine') + '</p>' + contactButtons(L('enquiryText', { tool: T(data.meta.name) })) + '</div>';
      } else {
        h += '<h3 class="r-h">' + L('fixListTitle') + '</h3>';
        if (r.open.length === 0) {
          h += '<p class="sec-intro">' + L('fixListEmpty') + '</p>';
        } else {
          h += '<div class="fixlist">' + data.sections.map(function (s) {
            var items = s.criteria.filter(function (c) { return !ticked[c.id]; });
            return '<div class="fixgroup"><h4>' + esc(s.letter) + ' · ' + E(s.name) + '</h4>' +
              (items.length ? '<ul>' + items.map(function (c) {
                return '<li><div class="fc">' + E(pick(c, 'text')) + '</div><div class="ff">' + E(pick(c, 'fix')) + '</div></li>';
              }).join('') + '</ul>' : '<p class="empty">' + L('sectionComplete') + '</p>') + '</div>';
          }).join('') + '</div>';
        }
        var tk = [];
        data.sections.forEach(function (s) { s.criteria.forEach(function (c) { if (ticked[c.id]) tk.push(T(pick(c, 'text'))); }); });
        h += '<div class="print-only ticked"><h3 class="r-h">' + L('tickedTitle') + '</h3>' +
          (tk.length ? '<ul>' + tk.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p>' + L('tickedNone') + '</p>') + '</div>';
        h += '<div class="results-btns btns"><button type="button" class="btn btn-navy" id="download-btn">' + L('download') + '</button></div>' +
          '<p class="sec-intro" id="download-note">' + L('downloadNote') + '</p>';
      }
      $('results-body').innerHTML = h;
      var dl = $('download-btn');
      if (dl) dl.addEventListener('click', function () {
        $('print-date').textContent = L('printedOn', { date: new Date().toLocaleDateString(lang) });
        try { window.print(); } catch (e) {}
      });
      return r;
    }

    function renderFamily() {
      var f = data.family;
      var cards = f.tools.map(function (t) {
        var here = t.id === data.meta.id;
        return '<a href="' + (here ? '#' : esc(t.url)) + '"' + (here ? ' class="here" aria-current="page"' : '') + '><b>' + E(t.name) + '</b><small>' + E(t.blurb) + '</small>' +
          '<span class="aud">' + E(t.audience) + '</span></a>';
      }).join('');
      return '<section id="family"><div class="wrap"><h2>' + E(f.title) + '</h2><p class="sec-intro">' + E(f.intro) + '</p><div class="family">' + cards + '</div></div></section>';
    }

    function renderRelated() {
      var r = data.related;
      var src = r.sourcesUrl || (data.meta.id + '-sources.html');
      return '<section id="related"><div class="wrap"><h2>' + E(r.title) + '</h2><div class="prose related-body">' +
        r.paragraphs.map(function (p) { return '<p>' + E(p) + '</p>'; }).join('') + '</div>' +
        '<div class="btns">' + link(src, 'btn-plain', L('sourcesBtn')) + '</div>' +
        '<p class="sources-note">' + L('sourcesNote') + '</p></div></section>';
    }

    function renderAbout() {
      var a = data.about;
      return '<section id="about"><div class="wrap"><div class="about"><img src="' + a.photo + '" alt="' + E(a.alt) + '" width="400" height="521">' +
        '<div><h2>' + E(a.title) + '</h2><div class="prose about-bio">' + T(a.bio).split(/\n\s*\n/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></div></div></div></section>';
    }

    function renderContact() {
      var c = data.contact;
      return '<section class="contact" id="contact"><div class="wrap"><h2>' + E(c.title) + '</h2>' +
        '<p class="prose" style="margin-top:14px">' + E(c.body) + '</p>' + contactButtons('') +
        '<p class="addr">' + L('contactLine', { phone: c.phoneDisplay, email: c.email }) + '</p></div></section>';
    }

    function renderFooter() {
      var links = [{ url: data.links.youtube, name: data.labels.channel }]
        .concat(data.family.tools.filter(function (t) { return t.id !== data.meta.id; }))
        .concat([{ url: data.links.card, name: data.labels.card }]);
      return '<footer><div class="wrap"><span>' + E(data.labels.copyright) + '</span><nav aria-label="' + L('footerNav') + '">' +
        links.map(function (l) { return '<a href="' + esc(l.url) + '">' + E(l.name) + '</a>'; }).join('') + '</nav></div></footer>';
    }

    /* ---------- behaviour ---------- */
    function updateProgress() {
      var r = score(data, ticked);
      r.sections.forEach(function (s) {
        $('bar-' + s.id).style.width = s.pct + '%';
        $('n-' + s.id).textContent = s.met + '/' + s.n;
      });
      var line = L('inPlace', { n: r.met, total: r.total });
      $('total').textContent = line;
      $('mcount').textContent = line;
    }
    function show() {
      renderResults();
      $('results').hidden = false;
      $('stale').hidden = true;
      shown = true;
      var hd = $('results-h');
      try { hd.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); } catch (e) { hd.scrollIntoView(); }
      try { hd.focus({ preventScroll: true }); } catch (e) { hd.focus(); }
    }
    function applyView(v) {
      view = v;
      data.sections.forEach(function (s) {
        $('fq-' + s.id).textContent = T(pick(s, 'question'));
        s.criteria.forEach(function (cr) { $('lb-' + cr.id).innerHTML = critLabel(cr); });
      });
      var pt = T(vtext('panelTitle', data.checklist.panelTitle));
      $('panel-h').textContent = pt;
      $('panel').setAttribute('aria-label', pt);
      $('hero-pdf').setAttribute('href', pdfHref());
      $('cl-pdf').setAttribute('href', pdfHref());
      if (shown) { renderResults(); $('stale').hidden = true; }
    }
    var resetArmed = null;
    function reset() {
      var btn = $('reset-btn');
      if (!resetArmed) {
        btn.textContent = L('resetConfirm');
        resetArmed = setTimeout(function () { resetArmed = null; btn.textContent = L('reset'); }, 4000);
        return;
      }
      clearTimeout(resetArmed); resetArmed = null;
      btn.textContent = L('reset');
      ticked = {};
      Array.prototype.forEach.call(document.querySelectorAll('#tool-form input'), function (i) { i.checked = false; });
      $('results').hidden = true; shown = false;
      updateProgress();
      $('tool-form').querySelector('input').focus();
    }

    this.mount = function (el) {
      document.documentElement.lang = lang;
      document.documentElement.dir = (data.meta.dir) || 'ltr';
      el.innerHTML = renderHero() + '<main>' + renderOverview() + renderChecklist() + renderResultsShell() +
        renderFamily() + renderRelated() + renderAbout() + renderContact() + '</main>' + renderFooter();
      document.body.classList.add('has-mbar');
      $('tool-form').addEventListener('submit', function (e) { e.preventDefault(); });
      $('tool-form').addEventListener('change', function (e) {
        var id = e.target.getAttribute('data-id');
        if (!id) return;
        if (e.target.checked) ticked[id] = true; else delete ticked[id];
        updateProgress();
        if (shown) $('stale').hidden = false;
      });
      $('show-btn').addEventListener('click', show);
      $('mshow-btn').addEventListener('click', show);
      $('update-btn').addEventListener('click', show);
      $('reset-btn').addEventListener('click', reset);
      if (VX) $('views').addEventListener('change', function (e) { if (e.target.name === 'tool-view') applyView(e.target.value); });
      updateProgress();
    };
  }

  var Engine = { version: '1.4.0', score: score, txt: txt, fill: fill, esc: esc };
  if (typeof module !== 'undefined' && module.exports) { module.exports = Engine; return; }
  root.CreationsEngine = Engine;
  function boot() {
    var node = document.getElementById('tool-data');
    var app = document.getElementById('app');
    if (!node || !app) return;
    new App(JSON.parse(node.textContent)).mount(app);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(this);

</script>
</body>
</html>
